# Grafana file-provisioned alert rules (apiVersion 1).
# https://grafana.com/docs/grafana/latest/alerting/set-up/provision-alerting-resources/file-provisioning/
#
# No contact point/notification policy is configured here on purpose — these alerts are
# visible in Grafana's Alerting UI (http://grafana.home/alerting/list) only, no external
# delivery (ntfy/Discord/etc) set up yet. See ai/OBSERVABILITY.md.
#
# Datasource UID PBFA97CFB590B2093 = the grafana-alloy-prometheus datasource (confirmed live
# via GET /api/datasources — re-check if this ever changes, per ai/PATTERNS.md convention).

apiVersion: 1

groups:
  - orgId: 1
    name: Container Health
    folder: Homelab Alerts
    interval: 1m
    rules:
      - uid: container-mem-near-limit
        title: Container memory near limit
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: (max by (name) (container_memory_working_set_bytes{name!=""})) / (max by (name) (container_spec_memory_limit_bytes{name!=""} > 0))
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.9]
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} is using more than 90% of its container memory limit"

      - uid: container-oom-killed
        title: Container OOM killed
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: increase(container_oom_events_total{name!=""}[5m])
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: sum
              refId: B
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.name }} was OOM-killed in the last 5 minutes"

      - uid: container-restart-loop
        title: Container restarting repeatedly
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: resets(container_start_time_seconds{name!=""}[30m])
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [2]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} has restarted more than twice in the last 30 minutes"

      - uid: scrape-target-down
        title: Monitoring scrape target down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: up
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus scrape target {{ $labels.job }} ({{ $labels.instance }}) is down - every other alert in this repo goes blind while this is unresolved"
