# Grafana file-provisioned alert rules (apiVersion 1).
# https://grafana.com/docs/grafana/latest/alerting/set-up/provision-alerting-resources/file-provisioning/
#
# No contact point/notification policy is configured here on purpose — these alerts are
# visible in Grafana's Alerting UI (http://grafana.home/alerting/list) only, no external
# delivery (ntfy/Discord/etc) set up yet. See ai/OBSERVABILITY.md.
#
# Datasource UID PBFA97CFB590B2093 = the grafana-alloy-prometheus datasource (confirmed live
# via GET /api/datasources — re-check if this ever changes, per ai/PATTERNS.md convention).

apiVersion: 1

groups:
  - orgId: 1
    name: Container Health
    folder: Homelab Alerts
    interval: 1m
    rules:
      - uid: container-mem-near-limit
        title: Container memory near limit
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: (max by (name) (container_memory_working_set_bytes{name!=""})) / (max by (name) (container_spec_memory_limit_bytes{name!=""} > 0))
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.9]
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} is using more than 90% of its container memory limit"

      - uid: container-oom-killed
        title: Container OOM killed
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: increase(container_oom_events_total{name!=""}[5m])
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: sum
              refId: B
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.name }} was OOM-killed in the last 5 minutes"

      - uid: container-restart-loop
        title: Container restarting repeatedly
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: resets(container_start_time_seconds{name!=""}[30m])
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [2]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} has restarted more than twice in the last 30 minutes"

      - uid: scrape-target-down
        title: Monitoring scrape target down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: up
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus scrape target {{ $labels.job }} ({{ $labels.instance }}) is down - every other alert in this repo goes blind while this is unresolved"

      - uid: container-unhealthy
        title: Container healthcheck failing
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              # == 0 is required, not just a `< 1` threshold below: cAdvisor's fork used here
              # (grafana/alloy's embedded build) returns -1 for "no HEALTHCHECK defined" - a
              # distinct value from 0 ("unhealthy") and 1 ("healthy"), not documented upstream but
              # confirmed live 2026-09-12 (every container without a compose healthcheck sits at
              # -1 permanently). A bare `< 1` threshold treated -1 the same as failing and fired
              # non-stop for every such container (alloy, loki, smartctl-exporter, valheim, etc)
              # - see ai/OBSERVABILITY.md.
              expr: container_health_state{name!=""} == 0
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.name }}'s Docker healthcheck is failing (or the container has been stuck starting for 3+ minutes) - real per-container signal from cAdvisor's container_health_state, not just cAdvisor's own is-the-process-running check"

  - orgId: 1
    name: Host Health
    folder: Homelab Alerts
    interval: 1m
    rules:
      - uid: host-cpu-saturated
        title: Host CPU saturated
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m]))) * 100
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [85]
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU averaged over 85% busy for 10+ minutes - N150 is a low-power host, check whether the Valheim server or another container is the driver (Container Rightsizing dashboard's CPU panel)"

      - uid: host-memory-low
        title: Host memory available low
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [10]
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Host available memory below 10% for 10+ minutes - real OOM risk, see #120 in ai/todo.md for per-container mem_limit rightsizing"

  - orgId: 1
    name: Disk Health
    folder: Homelab Alerts
    interval: 5m
    rules:
      # Known-bad metric per prometheus-community/smartctl_exporter#229/#265: don't gate
      # solely on this being unhealthy without also watching for exporter/smartctl errors,
      # but 0 is still the documented "failed" value and worth paging on immediately.
      - uid: smart-status-failed
        title: Disk SMART status failed
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: smartctl_device_smart_status
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} is reporting SMART status FAILED - back it up / plan replacement now, this is the drive's own overall-health verdict"

      # Delta over a day, not the absolute count - a drive can ship from the factory with a
      # couple of reallocated sectors and stay fine for years; what matters is whether the
      # count is actively climbing (peira.dev's writeup, see chat history 2026-09-12).
      - uid: smart-reallocated-sectors-climbing
        title: Reallocated sector count climbing
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: increase(smartctl_device_attribute{attribute_name="Reallocated_Sector_Ct", attribute_value_type="raw"}[24h])
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }}'s Reallocated_Sector_Ct rose in the last 24h - new bad sectors are actively appearing, not just a static factory count"

      - uid: smart-pending-sectors-climbing
        title: Pending sector count climbing
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: increase(smartctl_device_attribute{attribute_name="Current_Pending_Sector", attribute_value_type="raw"}[24h])
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }}'s Current_Pending_Sector rose in the last 24h - sectors are awaiting remap, precursor to reallocation"

      # HDD-only (sda/sdb, the Data pool) - 60C threshold per general HDD guidance, not yet
      # calibrated against this host's actual idle baseline (see chat 2026-09-12). Revisit
      # once a few weeks of real temperature data exist in Grafana - want to confirm this
      # doesn't false-positive on normal always-on spinning-disk operating temps.
      - uid: smart-hdd-temperature-high
        title: HDD temperature high
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              # Bare device names ("sda"/"sdb"), not "/dev/sda" - confirmed live 2026-09-12 the
              # exporter strips the /dev/ prefix, which the original regex didn't account for
              # and caused a permanent DatasourceNoData alert (sda=36C, sdb=39C at the time, both
              # fine - this was a query bug, not a real temperature issue).
              expr: smartctl_device_temperature{device=~"sd[ab]", temperature_type="current"}
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [60]
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} (Data pool HDD) has run above 60C for 10+ minutes - check case airflow"

      # node_exporter's zfs collector already reads /proc/spl/kstat/zfs/<pool>/state (found live
      # 2026-09-12 - no new exporter needed) and publishes one series per (zpool, state) pair,
      # value 1 on whichever state is current and 0 on the rest - see ai/OBSERVABILITY.md. A
      # pool-level DEGRADED/FAULTED (a drive dropped from the mirror, resilver needed) is a
      # more urgent signal than a single SMART attribute, and wasn't being watched at all
      # before this alert existed despite the data already flowing.
      - uid: zfs-pool-not-online
        title: ZFS pool not online
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: node_zfs_zpool_state{state="online"}
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        noDataState: Alerting
        execErrState: Alerting
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.zpool }} is not ONLINE (degraded/faulted/offline/suspended/unavail) - check `zpool status {{ $labels.zpool }}`, a drive may have dropped out of the mirror"
