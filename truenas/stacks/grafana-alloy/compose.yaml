# =============================================================================
# Grafana Alloy + Loki + Prometheus + Grafana - TrueNAS Scale (Dockhand-managed)
# =============================================================================
# Self-hosted observability, trial 2 of 3 (see
# .claude/plans/look-at-the-observability-md-fluffy-popcorn.md). Adapted from
# Grafana's OWN official reference stack:
#   github.com/grafana/alloy-scenarios/tree/main/docker-monitoring
# (docker-compose.yml, config.alloy, loki-config.yaml pulled and diffed
# against this file — not invented from a summary).
#
# Deviations from that upstream reference, and why:
#   - Ports remapped to avoid live collisions: Grafana UI 3000->3010 (3000
#     is taken by commafeed on this host — verified via ss -tlnp).
#   - Loki's storage path changed from the reference's /tmp/loki to
#     /var/lib/loki (bind-mounted, see below) — /tmp would lose all log
#     data on every container restart.
#   - Prometheus given a persistent data bind mount — the reference has
#     none, meaning metrics history is lost on every restart otherwise.
#   - cAdvisor's /var/lib/docker mount points at TrueNAS's actual docker
#     root (/mnt/.ix-apps/docker), NOT the Linux-standard /var/lib/docker —
#     same TrueNAS-specific gotcha hit with the SigNoz filelog receiver.
#   - Container names, homepage labels, TZ, bind-mount data layout under
#     /mnt/Fast/docker/grafana-alloy/ to match this repo's conventions.
#
# KEPT from upstream despite being broad (not narrowed without verification,
# per this repo's "research first, don't guess" rule — cAdvisor's actual
# minimum required mount surface isn't independently confirmed):
#   - Alloy runs `privileged: true` with host /proc, /sys, /, device access.
#     This is cAdvisor's standard mount set for host+container introspection
#     (even with docker_only=true) as shipped in Grafana's own reference — a
#     real, broad grant, same class of tradeoff as SigNoz's docker.sock/root
#     access. Flagging explicitly rather than silently accepting.
#
# Storage layout:
#   /mnt/Fast/docker/grafana-alloy/data/loki        (Loki chunks/index)
#   /mnt/Fast/docker/grafana-alloy/data/prometheus   (Prometheus TSDB)
#   /mnt/Fast/docker/grafana-alloy/data/grafana      (Grafana DB/plugins)
#   /mnt/Fast/docker/grafana-alloy/data/alloy        (Alloy's own storage.path)
#   Config files (config.alloy, loki-config.yaml) are mounted via relative paths
#   that resolve inside Dockhand's git clone of this stack's directory, so they
#   come straight from git on each sync+deploy — same pattern as
#   config/provisioning/ below. (This used to require a manual scp to
#   /mnt/Fast/docker/grafana-alloy/config/ before each deploy, on the claim that
#   Dockhand's git-stack API only tracks compose.yaml — found 2026-09-09 to be
#   incorrect: git-sync applies every tracked file. The manual-scp path was
#   stale and silently absorbing every config.alloy/loki-config.yaml edit
#   without ever taking effect. See ai/OBSERVABILITY.md.)
#
# Ports (verified free via `ss -tlnp` on TrueNAS 2026-08-21):
#   Grafana UI:      3010  LAN-exposed (remapped from reference's 3000 -
#                          taken). This is the only port meant for outside
#                          access; Caddy proxies grafana.home to it.
#   Loki:            3100  loopback-only — push/query API has no auth
#   Prometheus:      9090  loopback-only — remote-write receiver has no auth
#   Alloy UI/API:    12345  loopback-only — exposes pipeline/component internals
#   OTLP gRPC/HTTP:  4317 / 4318  loopback-only, unused by anything currently
# All four loopback-only services are reached by other containers over the
# internal grafana-alloy-network instead (Alloy pushes to Loki/Prometheus
# that way already) — the host port publish exists only for occasional
# manual debugging from the TrueNAS box itself.
# =============================================================================

name: grafana-alloy

services:
  loki:
    image: grafana/loki:latest
    container_name: grafana-alloy-loki
    restart: unless-stopped
    mem_limit: 768m
    labels:
      - homelab.tier=critical
    environment:
      - TZ=Australia/Brisbane
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      # Relative path resolves inside Dockhand's git clone of this stack's directory,
      # so this comes straight from git on each sync+deploy - was previously an
      # absolute /mnt/Fast/docker/... path that predated Dockhand git-sync and was
      # never updated, so config edits silently never took effect (found 2026-09-09,
      # see ai/OBSERVABILITY.md).
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
      - /mnt/Fast/docker/grafana-alloy/data/loki:/var/lib/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - grafana-alloy-network

  prometheus:
    image: prom/prometheus:latest
    container_name: grafana-alloy-prometheus
    restart: unless-stopped
    mem_limit: 512m
    labels:
      - homelab.tier=critical
    environment:
      - TZ=Australia/Brisbane
    command:
      - --web.enable-remote-write-receiver
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - /mnt/Fast/docker/grafana-alloy/data/prometheus:/prometheus
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - grafana-alloy-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-alloy-grafana
    restart: unless-stopped
    mem_limit: 768m
    user: "1000:1000"
    labels:
      - homelab.tier=critical
      - homepage.group=Infrastructure
      - homepage.name=Grafana
      - homepage.icon=mdi-chart-areaspline
      - homepage.href=http://grafana.home
      - homepage.description=Observability - Loki logs + Prometheus metrics (trial 2)
    env_file:
      - /mnt/Fast/docker/grafana-alloy/.env
    environment:
      - TZ=Australia/Brisbane
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_ADMIN_USER=admin
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /etc/grafana/provisioning/datasources
        cat <<EOF > /etc/grafana/provisioning/datasources/ds.yaml
        apiVersion: 1
        datasources:
        - name: Loki
          type: loki
          access: proxy
          orgId: 1
          url: http://grafana-alloy-loki:3100
          basicAuth: false
          isDefault: false
          version: 1
          editable: false
          jsonData:
            # Loki has no ruler component configured (see loki-config.yaml) - without
            # this, Grafana's Alert rules page shows a permanent "Error" on a "Loki"
            # group because it tries to list Loki-native alert rules and gets a 404.
            # We only use Grafana-managed alerting (provisioning/alerting/rules.yaml),
            # never Loki-native rules, so there's nothing to manage here.
            manageAlerts: false
        - name: Prometheus
          type: prometheus
          orgId: 1
          url: http://grafana-alloy-prometheus:9090
          basicAuth: false
          isDefault: true
          version: 1
          editable: false
        EOF
        /run.sh
    ports:
      - "3010:3000"
    volumes:
      - /mnt/Fast/docker/grafana-alloy/data/grafana:/var/lib/grafana
      # File-provisioned alert rules (ai/OBSERVABILITY.md) — Dockhand git-syncs this stack's
      # dir, so config/provisioning/alerting/*.yaml comes straight from git on each deploy.
      # The entrypoint below writes config/provisioning/datasources/ds.yaml into the same
      # mount at container start (gitignored — runtime-generated, not tracked).
      - ./config/provisioning:/etc/grafana/provisioning
    healthcheck:
      test: curl -sf http://localhost:3000/api/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - grafana-alloy-network
    depends_on:
      - loki
      - prometheus

  alloy:
    image: grafana/alloy:latest
    container_name: grafana-alloy-alloy
    restart: unless-stopped
    mem_limit: 1g
    labels:
      - homelab.tier=critical
    privileged: true
    env_file:
      # DOCKHAND_METRICS_TOKEN, rendered by infisical-agent - see config.alloy's
      # dockhand scrape job, which reads it via sys.env().
      - /mnt/Fast/docker/grafana-alloy/.env
    environment:
      - TZ=Australia/Brisbane
      - ALLOY_DEPLOY_MODE=docker
    ports:
      - "127.0.0.1:12345:12345"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /mnt/Fast/docker/grafana-alloy/data/alloy:/var/lib/alloy/data
      - /proc:/rootproc:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /sys:/sys:ro
      - /:/rootfs:ro
      - /dev/disk/:/dev/disk:ro
      - /mnt/.ix-apps/docker:/var/lib/docker:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    devices:
      - /dev/kmsg
    networks:
      - grafana-alloy-network
    depends_on:
      - loki
      - prometheus

  # Standalone cAdvisor (2026-09-11) - see ai/OBSERVABILITY.md "cAdvisor container_health_state
  # caches at discovery" entry. Alloy's built-in prometheus.exporter.cadvisor embeds a Grafana
  # fork of cAdvisor pinned to a v0.54.1 base (over a year behind upstream, confirmed via
  # grafana/alloy go.mod on both v1.18.1 and latest v1.19.2 - the fork lags because cAdvisor
  # wasn't designed to be embedded as a library and needs manual patching to rebase). That old
  # base predates the upstream fix (google/cadvisor#3760, merged 2025-12-05, first released in
  # v0.60.5) for container_health_state being read once at container-discovery time instead of
  # refreshed every housekeeping cycle. Running cAdvisor as its own container - what it's
  # actually designed for - sidesteps the fork-lag problem entirely. Using :latest rather than
  # pinning v0.60.5 - that exact tag isn't published (gcr.io/cadvisor/cadvisor stopped at
  # v0.55.1; ghcr.io/google/cadvisor is the current registry per the project's own README, but
  # only ships :latest/major tags, not every patch version).
  cadvisor:
    image: ghcr.io/google/cadvisor:latest
    container_name: grafana-alloy-cadvisor
    restart: unless-stopped
    mem_limit: 256m
    privileged: true
    labels:
      - homelab.tier=critical
    environment:
      - TZ=Australia/Brisbane
    command:
      - --docker_only=true
      # Default metric set (app,cpu,cpuLoad,disk,diskIO,memory,network,oom_event,percpu,
      # perf_event,pressure) includes disk/diskIO, whose fsHandler does a recursive
      # filesystem walk (du + inode count) per container every housekeeping cycle -
      # confirmed live 2026-09-11 taking 2-3.5s per scan across ~38 containers and erroring
      # repeatedly on stale overlay2 dirs from already-removed containers, driving sustained
      # ~1.5 CPU cores on a 4-core host. Health status (container_health_state) is collected
      # via a separate Docker-inspect code path, not gated by this flag at all - dropping
      # disk/diskIO/percpu/perf_event/pressure/app/cpuLoad doesn't affect it. Narrowed to
      # exactly what this dashboard (container-rightsizing.json) actually queries.
      - --enable_metrics=cpu,memory,oom_event
    ports:
      # 8081 collides with Infisical's own API port on this host (verified via ss -tlnp
      # 2026-09-11) - 8090 confirmed free at the same time.
      - "127.0.0.1:8090:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      # TrueNAS's actual docker root, not the Linux-standard /var/lib/docker - same gotcha
      # documented above for the Alloy-embedded exporter.
      - /mnt/.ix-apps/docker:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    networks:
      - grafana-alloy-network

networks:
  grafana-alloy-network:
    name: grafana-alloy-network
