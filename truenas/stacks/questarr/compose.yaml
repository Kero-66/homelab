# =============================================================================
# Questarr Stack - TrueNAS Scale (Dockhand-managed)
# =============================================================================
# Game collection manager (Arr-style): tracks owned/wanted games, discovers via
# IGDB/Steam wishlist, searches indexers and hands releases to a download
# client. Deployed via Dockhand (docker compose), not midclt.
#
# Storage layout:
#   Config/DB → /mnt/Fast/docker/questarr/data/ (SQLite)
#
# Networking:
#   Joins arr-stack_default (external) to reach Prowlarr, and
#   downloaders_default (external) to reach qBittorrent by container name.
#
# First-run setup (via web UI at :5000):
#   - Twitch API Client ID/Secret for IGDB metadata
#   - Prowlarr sync or Torznab/Newznab indexer
#   - Download client (qBittorrent) connection
# =============================================================================

services:
  questarr:
    image: ghcr.io/doezer/questarr:latest
    container_name: questarr
    restart: unless-stopped
    mem_limit: 512m
    labels:
      - homepage.group=Media
      - homepage.name=Questarr
      - homepage.icon=mdi-controller-classic
      - homepage.href=http://questarr.home
      - homepage.description=Game collection tracking & automation
    ports:
      - "5060:5000"
    volumes:
      - /mnt/Fast/docker/questarr/data:/app/data
    environment:
      - PORT=5000
      - TZ=Australia/Brisbane
    networks:
      - arr-stack_default
      - downloaders_default

networks:
  arr-stack_default:
    external: true
  downloaders_default:
    external: true
