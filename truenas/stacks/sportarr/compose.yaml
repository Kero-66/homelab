# =============================================================================
# Sportarr Stack - TrueNAS Scale (Dockhand-managed)
# =============================================================================
# Sports PVR (Sonarr/Radarr-style) for Usenet and torrents — tracks leagues and
# events, searches indexers via Prowlarr, downloads via qBittorrent/SABnzbd.
# https://github.com/Sportarr/Sportarr — deployed as its own separate stack
# for now (not folded into arr-stack).
#
# Storage layout:
#   Config/DB  → /mnt/Fast/docker/sportarr/config (:/config)
#   Everything else is ONE mount spanning the whole unified Servarr dataset —
#   matches CLAUDE.md's "Hardlinks are load-bearing" rule: hardlinks fail
#   across separate bind mounts even on the same filesystem, and Sportarr's
#   view of a download's path must match qBittorrent's/SABnzbd's exactly.
#     /mnt/Data/Servarr -> /data
#
# Secrets:
#   Rendered by Infisical Agent from truenas/stacks/infisical-agent/sportarr.tmpl
#   into /mnt/Fast/docker/sportarr/.env (SPORTARR_API_KEY, PROWLARR_API_KEY).
#   SPORTARR_API_KEY doesn't exist until Sportarr's first boot generates one
#   (Settings > General) — add it to Infisical /media after that, then update
#   the homepage widget.key below and in services.yaml from "" to the var.
#
# Networking:
#   Joins arr-stack_default (external) to reach Prowlarr, and
#   downloaders_default (external) to reach qBittorrent/SABnzbd by container name.
# =============================================================================

services:
  sportarr:
    image: sportarr/sportarr:latest
    container_name: sportarr
    restart: unless-stopped
    mem_limit: 512m
    env_file:
      - /mnt/Fast/docker/sportarr/.env
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=022
      - TZ=Australia/Brisbane
    labels:
      - homelab.tier=noncritical
      - homepage.group=Media
      - homepage.name=Sportarr
      - homepage.icon=mdi-trophy
      - homepage.href=http://sportarr.home
      - homepage.description=Sports PVR (Usenet & torrents)
    ports:
      - "1867:1867"
    volumes:
      - /mnt/Fast/docker/sportarr/config:/config
      - /mnt/Data/Servarr:/data
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:1867/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - arr-stack_default
      - downloaders_default

networks:
  arr-stack_default:
    external: true
  downloaders_default:
    external: true
