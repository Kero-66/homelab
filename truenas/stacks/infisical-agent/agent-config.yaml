# =============================================================================
# Infisical Agent Configuration
# =============================================================================
# This file is mounted into the agent container at /config/agent-config.yaml,
# read from Dockhand's git clone of this directory (see compose.yaml).
# It defines how the agent authenticates and what secrets to render.
# =============================================================================

infisical:
  address: "http://192.168.20.22:8081"  # updated from 192.168.20.66 — apply after Infisical migrates to TrueNAS

auth:
  type: "universal-auth"
  config:
    # These files are created by setup_agent.sh (one-time setup) and live on
    # /auth (NOT git-synced) - see compose.yaml's second volume mount
    client-id: "/auth/client-id"
    client-secret: "/auth/client-secret"
    # Remove client-secret from disk after first read for extra security
    remove_client_secret_on_read: false

sinks:
  - type: "file"
    config:
      path: "/auth/access-token"

templates:
  # Jellyfin stack secrets
  - source-path: /config/jellyfin.tmpl
    destination-path: /output/jellyfin/.env
    config:
      polling-interval: 5m

  # Arr stack secrets (Sonarr, Radarr, Prowlarr, Bazarr, Recyclarr, FlareSolverr, Cleanuparr)
  - source-path: /config/arr-stack.tmpl
    destination-path: /output/arr-stack/.env
    config:
      polling-interval: 5m

  # Downloader secrets (qBittorrent, SABnzbd)
  - source-path: /config/downloaders.tmpl
    destination-path: /output/downloaders/.env
    config:
      polling-interval: 5m

  # Tailscale secrets (subnet router)
  - source-path: /config/tailscale.tmpl
    destination-path: /output/tailscale/.env
    config:
      polling-interval: 5m

  # Homepage dashboard secrets (API keys for all services)
  - source-path: /config/homepage.tmpl
    destination-path: /output/homepage/.env
    config:
      polling-interval: 5m

  # Commafeed RSS reader secrets
  - source-path: /config/commafeed.tmpl
    destination-path: /output/commafeed/.env
    config:
      polling-interval: 5m

  # SigNoz observability stack secrets
  - source-path: /config/signoz.tmpl
    destination-path: /output/signoz/.env
    config:
      polling-interval: 5m

  # Grafana Alloy observability stack secrets
  - source-path: /config/grafana-alloy.tmpl
    destination-path: /output/grafana-alloy/.env
    config:
      polling-interval: 5m

  # Shoko stack secrets
  - source-path: /config/shokoanime.tmpl
    destination-path: /output/shokoanime/.env
    config:
      polling-interval: 5m
