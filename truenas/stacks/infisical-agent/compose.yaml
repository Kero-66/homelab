# =============================================================================
# Infisical Agent - TrueNAS Scale
# =============================================================================
# Fetches secrets from Infisical and writes .env files for other stacks.
# Runs as a separate TrueNAS Custom App, independent of any stack.
#
# Setup (one-time, from your workstation):
#   1. Create a Machine Identity in Infisical dashboard
#   2. Run: bash truenas/scripts/setup_agent.sh
#
# Deployment: Dockhand git-synced stack (see truenas/DOCKHAND_GITOPS_GUIDE.md).
# Volumes use relative paths so config/templates come from Dockhand's git
# clone of this directory on every sync+deploy - no manual scp required.
#
# =============================================================================

services:
  infisical-agent:
    image: infisical/cli:latest
    container_name: infisical-agent
    restart: unless-stopped
    command: agent --config /config/agent-config.yaml
    volumes:
      # Agent config and templates - relative path resolves inside Dockhand's
      # git clone of this stack's directory, so agent-config.yaml and every
      # *.tmpl come straight from git on each sync+deploy (no scp needed)
      - ./:/config:ro
      # Output directory - agent writes .env files here
      - /mnt/Fast/docker:/output
    # No ports needed - agent only makes outbound HTTPS calls to Infisical
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'infisical agent' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
