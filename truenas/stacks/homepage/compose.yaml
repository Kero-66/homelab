# =============================================================================
# Homepage Dashboard - TrueNAS Edition
# =============================================================================
# Unified dashboard for all homelab services
#
# Storage layout:
#   Config → ./config (this stack's dir, Dockhand git-synced, read-only)
#   State  → /mnt/Fast/docker/homepage/state/     (NVMe - logs, not git-synced;
#            see settings.yaml's logpath, same split as infisical-agent's /auth)
#   .env   → /mnt/Fast/docker/homepage/.env       (NVMe - API keys from Infisical)
#
# Secrets:
#   Managed by Infisical Agent → writes .env to /mnt/Fast/docker/homepage/.env
#   Template: truenas/stacks/infisical-agent/homepage.tmpl
#   Source: Infisical /media path (same as arr-stack)
#
# Network Access:
#   - Joins arr-stack, jellyfin, and fileflows networks to access service APIs
#   - Accesses services via container names (sonarr, radarr, etc.)
#
# =============================================================================

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    mem_limit: 256m
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Australia/Brisbane
      - NODE_ENV=production
      - HOMEPAGE_ALLOWED_HOSTS=homepage.home
    env_file:
      - /mnt/Fast/docker/homepage/.env
    volumes:
      # Homepage configuration - Dockhand git clone of this stack's directory,
      # so config yaml/css/js come straight from git on each sync+deploy (no
      # manual scp) - matches infisical-agent's pattern
      - ./config:/app/config:ro
      # Writable state (logs) - kept out of the git-synced config dir, see
      # settings.yaml's logpath
      - /mnt/Fast/docker/homepage/state:/app/state
      - /mnt/Data/Servarr/:/data
    ports:
      - "3000:3000"
    networks:
      - arr-stack_default
      - jellyfin_default
      - fileflows_default
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  arr-stack_default:
    external: true
  jellyfin_default:
    external: true
  fileflows_default:
    external: true
