# =============================================================================
# Homepage Dashboard - TrueNAS Edition
# =============================================================================
# Unified dashboard for all homelab services
#
# Storage layout:
#   Config → ./config (this stack's dir, Dockhand git-synced)
#   .env   → /mnt/Fast/docker/homepage/.env       (NVMe - API keys from Infisical)
#
# Logs: homepage writes its logfile inside config/logs/ by default (same
# convention as every other stack here - radarr, prowlarr, bazarr, qbittorrent,
# sabnzbd, cleanuparr all write logs inside their single /config mount).
# The mount is writable (not :ro) to allow this; verified Dockhand's git sync
# only touches tracked files and leaves untracked ones (like config/logs/)
# alone, so this coexists safely with git-sync.
#
# Secrets:
#   Managed by Infisical Agent → writes .env to /mnt/Fast/docker/homepage/.env
#   Template: truenas/stacks/infisical-agent/homepage.tmpl
#   Source: Infisical /media path (same as arr-stack)
#
# Network Access:
#   - Joins arr-stack, jellyfin, and fileflows networks to access service APIs
#   - Accesses services via container names (sonarr, radarr, etc.)
#
# =============================================================================

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    mem_limit: 256m
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Australia/Brisbane
      - NODE_ENV=production
      - HOMEPAGE_ALLOWED_HOSTS=homepage.home
    env_file:
      - /mnt/Fast/docker/homepage/.env
    volumes:
      # Homepage configuration - Dockhand git clone of this stack's directory,
      # so config yaml/css/js come straight from git on each sync+deploy (no
      # manual scp). Writable (not :ro) - homepage writes its logfile into
      # config/logs/ at runtime, see comment above.
      - ./config:/app/config
      - /mnt/Data/Servarr/:/data
    ports:
      - "3000:3000"
    networks:
      - arr-stack_default
      - jellyfin_default
      - fileflows_default
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  arr-stack_default:
    external: true
  jellyfin_default:
    external: true
  fileflows_default:
    external: true
