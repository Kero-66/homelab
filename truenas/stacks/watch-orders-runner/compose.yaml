# =============================================================================
# Watch-Orders Runner - TrueNAS Scale (Dockhand-managed)
# =============================================================================
# Periodically reruns the manual franchise-watch-order playlists
# (media/scripts/watch_orders/*.json, built by build_playlist.py) so new
# episodes/seasons already covered by an existing entry splice in automatically,
# without a human remembering to rerun the script. Genuinely new titles (never
# referenced by any entry) still need a human to add a line to the JSON first --
# see media/scripts/watch_orders/README.md.
#
# Deliberately minimal: python:alpine + a plain sleep loop, no cron daemon/app
# (build_playlist.py is stdlib-only, no pip install needed either).
#
# Scripts come from /mnt/Fast/docker/watch-orders-runner/scripts, staged via
# scp -- NOT a relative git-synced mount. Tried that first (same trick as
# infisical-agent's own templates) and it silently failed: Dockhand's git sync
# for a stack only checks out that stack's OWN truenas/stacks/<name>/ folder,
# not the whole repo, so a relative path reaching outside it (up to
# media/scripts/watch_orders) resolved to a host path that had never been
# populated -- Docker created it as an empty directory rather than erroring,
# so the container ran fine but had nothing to execute. Confirmed live
# 2026-09-15. media/scripts/watch_orders/*.json editors: scp the changed
# file(s) to /mnt/Fast/docker/watch-orders-runner/scripts/ afterward, same as
# every other Dockhand app's non-compose config in this repo (Caddyfile,
# homepage config, etc) -- see truenas/DEPLOYMENT_GUIDE.md.
#
# Playlist removal is already automatic for free (Jellyfin drops a dead item
# reference from a playlist when the item is deleted) -- this container only
# needs to handle growth. build_playlist.py builds a PARTIAL playlist from
# whatever's already available and logs (not fails on) any entry that isn't
# downloaded yet -- a franchise mid-acquisition (e.g. Gundam UC as of
# 2026-09-15) gets a real, usable playlist today from what you already have,
# not nothing, and the missing entries splice in automatically once they land.
# =============================================================================

services:
  watch-orders-runner:
    image: python:3.13-alpine
    container_name: watch-orders-runner
    restart: unless-stopped
    mem_limit: 128m
    user: "1000:1000"
    labels:
      - homelab.tier=noncritical
    entrypoint: ["/scripts-runner/entrypoint.sh"]
    environment:
      # Once a day is plenty -- new episodes don't need minute-level latency,
      # and this keeps Jellyfin request volume trivial.
      - INTERVAL_SECONDS=86400
      # Docker service name, not jellyfin.home -- this container has no
      # guaranteed .home DNS resolution (see build_playlist.py's BASE comment).
      - JELLYFIN_BASE_URL=http://jellyfin:8096
    env_file:
      - /mnt/Fast/docker/watch-orders-runner/.env
    volumes:
      # media/scripts/watch_orders/*.py and *.json, staged via scp -- see the
      # note above. NOT git-synced; update on every edit to the source files.
      - /mnt/Fast/docker/watch-orders-runner/scripts:/scripts:ro
      # This stack's own entrypoint IS git-synced fine (relative path within
      # this stack's own directory, same trick infisical-agent uses).
      - ./entrypoint.sh:/scripts-runner/entrypoint.sh:ro
    networks:
      - jellyfin_default

networks:
  jellyfin_default:
    external: true
