# =============================================================================
# Watch-Orders Runner - TrueNAS Scale (Dockhand-managed)
# =============================================================================
# Periodically reruns the manual franchise-watch-order playlists
# (./scripts/*.json, built by build_playlist.py) so new
# episodes/seasons already covered by an existing entry splice in automatically,
# without a human remembering to rerun the script. Genuinely new titles (never
# referenced by any entry) still need a human to add a line to the JSON first --
# see ./scripts/README.md.
#
# Deliberately minimal: python:alpine + a plain sleep loop, no cron daemon/app
# (build_playlist.py is stdlib-only, no pip install needed either).
#
# Scripts live in ./scripts (this stack's own directory) and are git-synced by
# Dockhand like every other file here -- edit, commit, sync, done. No scp step.
#
# They used to live in media/scripts/watch_orders and be scp'd to
# /mnt/Fast/docker/watch-orders-runner/scripts, because a relative mount
# reaching outside this stack's folder silently failed: Dockhand's git sync
# only checks out a stack's OWN truenas/stacks/<name>/ folder, so the path
# resolved to a host dir that had never been populated -- Docker created it as
# an empty directory rather than erroring, so the container ran fine with
# nothing to execute (confirmed live 2026-09-15). Moving the scripts into this
# directory removes that whole class of problem (2026-09-18).
#
# Playlist removal is already automatic for free (Jellyfin drops a dead item
# reference from a playlist when the item is deleted) -- this container only
# needs to handle growth. build_playlist.py builds a PARTIAL playlist from
# whatever's already available and logs (not fails on) any entry that isn't
# downloaded yet -- a franchise mid-acquisition (e.g. Gundam UC as of
# 2026-09-15) gets a real, usable playlist today from what you already have,
# not nothing, and the missing entries splice in automatically once they land.
# =============================================================================

services:
  watch-orders-runner:
    image: python:3.13-alpine
    container_name: watch-orders-runner
    restart: unless-stopped
    mem_limit: 128m
    user: "1000:1000"
    labels:
      - homelab.tier=noncritical
    entrypoint: ["/scripts-runner/entrypoint.sh"]
    environment:
      # Once a day is plenty -- new episodes don't need minute-level latency,
      # and this keeps Jellyfin request volume trivial.
      - INTERVAL_SECONDS=86400
      # Docker service name, not jellyfin.home -- this container has no
      # guaranteed .home DNS resolution (see build_playlist.py's BASE comment).
      - JELLYFIN_BASE_URL=http://jellyfin:8096
    env_file:
      - /mnt/Fast/docker/watch-orders-runner/.env
    volumes:
      # Git-synced (2026-09-18). Previously these lived in media/scripts/watch_orders
      # and had to be scp'd to /mnt/Fast/docker/watch-orders-runner/scripts on every
      # edit, because Dockhand's git sync only checks out a stack's OWN
      # truenas/stacks/<name>/ folder -- a relative path reaching up and across to
      # media/scripts/ resolved to a never-populated host dir, which Docker silently
      # created as an empty directory rather than erroring. Moving the scripts INTO
      # this stack's directory makes a plain relative mount work, so edits now ship
      # with a normal commit + sync like every other file in this repo.
      - ./scripts:/scripts:ro
      - ./entrypoint.sh:/scripts-runner/entrypoint.sh:ro
    networks:
      - jellyfin_default

networks:
  jellyfin_default:
    external: true
